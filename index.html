<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TFI Heroes — Animated Reminder Companion</title>
  <meta name="description" content="Your favourite TFI hero walks in to remind you — customise costumes, schedule reminders, say YES or NO.">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><i>🎬</i><span>TFI Heroes</span></div>
      <nav class="nav" id="nav">
        <a href="#/home" data-r="home"><span class="ic">🏠</span><span>Home</span></a>
        <a href="#/gallery" data-r="gallery"><span class="ic">🌟</span><span>Heroes</span></a>
        <a href="#/studio" data-r="studio"><span class="ic">👔</span><span>Costume</span></a>
        <a href="#/reminders" data-r="reminders"><span class="ic">⏰</span><span>Reminders</span></a>
        <a href="#/playground" data-r="playground"><span class="ic">🎭</span><span>Playground</span></a>
        <a href="#/settings" data-r="settings"><span class="ic">⚙️</span><span>Settings</span></a>
      </nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div id="modal"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
